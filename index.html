<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pool Storage VM</title>
<style>:root{--bg:#0f1419;--c:#1a222c;--t:#e6edf3;--m:#8b98a5;--ok:#3fb950;--bad:#f85149;--a:#58a6ff}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--m);font-size:13px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:var(--c);padding:6px 12px;border-radius:99px;font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.card{background:var(--c);border-radius:12px;padding:14px;margin-bottom:12px}.big{font-size:26px;font-weight:600}.bar{height:8px;background:#2b3644;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--a)}.n{display:flex;justify-content:space-between;font-size:14px}.n small{color:var(--m)}</style></head><body>
<h1>Pool Storage VM</h1><div class="sub">/mnt/pool &middot; port 62028 &middot; replikasi 2 salinan &middot; <span id="t">-</span></div>
<div class="row" id="st"></div><div class="card"><div class="n"><span>Kapasitas pool</span><small id="pct"></small></div><div class="big" id="cap">-</div><div class="bar"><i id="cb" style="width:0"></i></div></div><div id="nodes"></div>
<script>const g=n=>(n/1073741824).toFixed(1)+' GB';function pl(l,o){return '<span class="pill">'+l+' <b class="'+(o?'ok':'bad')+'">'+(o?'aktif':'mati')+'</b></span>'}
async function r(){try{const d=await (await fetch('/api/status')).json();document.getElementById('t').textContent=d.t;
document.getElementById('st').innerHTML=pl('Master',d.master)+pl('Filer',d.filer)+pl('Mount',d.mount)+'<span class="pill">Node <b>'+d.nodes.length+'</b></span>';
if(d.disk){const p=d.disk.used/d.disk.total*100;document.getElementById('cap').textContent=g(d.disk.used)+' / '+g(d.disk.total);document.getElementById('pct').textContent=p.toFixed(1)+'% terpakai';document.getElementById('cb').style.width=p+'%'}
document.getElementById('nodes').innerHTML=d.nodes.sort((a,b)=>a.nama.localeCompare(b.nama,'id',{numeric:true})).map(n=>{const p=n.max?n.vol/n.max*100:0;return '<div class="card"><div class="n"><span>'+n.nama+'</span><small>'+n.ip+'</small></div><div class="n"><small>volume '+n.vol+' / '+n.max+'</small><small>'+p.toFixed(0)+'%</small></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join('')}catch(e){document.getElementById('st').innerHTML='<span class="pill bad">Gagal memuat</span>'}}
r();setInterval(r,5000)</script></body></html>
